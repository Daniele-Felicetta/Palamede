[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-agent"
version = "0.1.0"
description = "Persistent-state, memory-centric, neuromorphic-inspired decision agent; Jev-style typed decisions via rizzo-flow"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.12"]

[project.scripts]
jev-agent = "jev_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
